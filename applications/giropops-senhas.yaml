apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: giropops-senhas
  namespace: argocd
spec:
  project: 'default'
  source:
    helm: {}
    repoURL: 'https://github.com/dcamppos83/descomplicando-gitops-no-kubernetes-argocd.git'
    targetRevision: 'feat/day2'
    path: 'giropops-senhas/helm'
  destination:
    namespace: 'giropops-senhas'
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      selfHeal: true # mesmo tentando alterar alguma conf no cluster manualmente, o argocd volta a conf que esta no git.
    syncOptions:
      - CreateNamespace=true